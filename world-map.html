<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خريطة عالم إل</title>
<link rel="stylesheet" href="styles.css">
<style>
  .map-track {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    max-width: 380px;
    width: 100%;
  }
  .station {
    width: 100%;
    background: white;
    border-radius: 24px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 6px 18px rgba(27,42,74,0.08);
    text-decoration: none;
    color: var(--color-brand-navy);
    font-weight: 700;
    font-size: 17px;
    transition: transform var(--motion-fast);
  }
  .station.active { border: 3px solid var(--color-brand-teal); }
  .station.locked { opacity: 0.45; }
  .station:active.active { transform: scale(0.97); }
  .station-emoji { font-size: 28px; }
  .station-status { margin-inline-start: auto; font-size: 13px; opacity: 0.6; }
</style>
</head>
<body class="student-zone">
  <img src="assets/logo.png" alt="عالم إل" class="logo-mark" onerror="this.src='logo.png'">
  <h1 id="greeting">أهلاً 🌍</h1>
  <p class="subtitle">اختار المحطة اللي عايز تروحلها</p>

  <div class="map-track" id="track">جاري التحميل...</div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = "https://eaionqqnkqodsggipaqa.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_VdVEhpTaeAtv3v9IJQuXiA_gA6_WKCU";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const studentId = localStorage.getItem('elh_student_id');
    const studentName = localStorage.getItem('elh_student_name');

    if (!studentId) {
      location.href = 'student-login.html';
    }

    document.getElementById('greeting').textContent = `أهلاً يا ${studentName} 🌍`;

    const emojiByOrder = { 1: '🚪', 2: '🎨', 3: '🌳', 4: '💧', 5: '🌾', 6: '🌲' };
    const pageByOrder = { 1: 'unit1.html' };

    async function loadMap() {
      const { data: units } = await supabase
        .from('units')
        .select('id, order_index, location_name')
        .order('order_index');

      const trackEl = document.getElementById('track');
      trackEl.innerHTML = '';

      for (const unit of units) {
        const isBuilt = !!pageByOrder[unit.order_index];
        const el = document.createElement(isBuilt ? 'a' : 'div');
        el.className = `station ${isBuilt ? 'active' : 'locked'}`;
        if (isBuilt) el.href = pageByOrder[unit.order_index];
        el.innerHTML = `
          <span class="station-emoji">${emojiByOrder[unit.order_index] || '⭐'}</span>
          <span>محطة ${unit.order_index}: ${unit.location_name}</span>
          <span class="station-status">${isBuilt ? '' : 'قريبًا'}</span>
        `;
        trackEl.appendChild(el);
      }
    }

    loadMap();
  </script>
</body>
</html>
