<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة إل — الوحدة 1</title>
<link rel="stylesheet" href="styles.css">
<style>
  .progress-dots { display:flex; gap:8px; margin-bottom: 20px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#E3D9C6; }
  .dot.done { background: var(--color-brand-teal); }
  .dot.now { background: var(--color-accent-gold); transform: scale(1.3); }

  .stage-box {
    background: white;
    border-radius: var(--radius-student-lg);
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 24px rgba(27,42,74,0.08);
    text-align: center;
  }
  .char-img { width: 90px; margin-bottom: 12px; }
  .mc-btn {
    display:block; width:100%; margin:8px 0;
    font-family: var(--font-student); font-size:17px; font-weight:700;
    padding:14px; border-radius:18px; border:2px solid var(--color-bg-student);
    background: var(--color-bg-student); color: var(--color-brand-navy); cursor:pointer;
  }
  .mc-btn.correct { background: var(--color-meadow); color:white; border-color:var(--color-meadow); }
  .mc-btn.wrong { opacity:0.5; }
  .mic-btn {
    width:80px; height:80px; border-radius:50%; border:none;
    background: var(--color-accent-coral); color:white; font-size:32px; cursor:pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,0.1);
  }
  .stars-earned { font-size: 28px; margin: 12px 0; }
  .objects-row { display:flex; justify-content:center; gap:16px; margin: 16px 0; font-size: 40px; }
  .objects-row span { cursor:pointer; opacity:0.5; transition: opacity var(--motion-fast); }
  .objects-row span.revealed { opacity:1; }
</style>
</head>
<body class="student-zone">

  <div class="progress-dots" id="dots"></div>
  <div class="stage-box" id="stageBox">جاري التحميل...</div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = "https://eaionqqnkqodsggipaqa.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_VdVEhpTaeAtv3v9IJQuXiA_gA6_WKCU";
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const studentId = localStorage.getItem('elh_student_id');
    const studentName = localStorage.getItem('elh_student_name') || 'بطل';
    if (!studentId) location.href = 'student-login.html';

    const STAGES = ['learning_goal','story','adventure','game','practice','song','phonics','challenge','assessment'];
    let unitId = null;
    let current = 0;
    let phonicsIndex = 0; // 0 = T, 1 = I
    const letters = ['T', 'I'];
    let starsThisSession = 0;

    function renderDots() {
      const dotsEl = document.getElementById('dots');
      dotsEl.innerHTML = STAGES.map((s, i) =>
        `<div class="dot ${i < current ? 'done' : ''} ${i === current ? 'now' : ''}"></div>`
      ).join('');
    }

    async function completeStage(stageName, scoreInternal = {}) {
      await supabase.from('unit_progress').upsert({
        student_id: studentId,
        unit_id: unitId,
        stage: stageName,
        status: 'completed',
        completed_at: new Date().toISOString(),
        score_internal: scoreInternal
      }, { onConflict: 'student_id,unit_id,stage' });

      await supabase.from('rewards').insert({
        student_id: studentId,
        type: 'star',
        reference_unit_id: unitId
      });
      starsThisSession++;

      current++;
      renderDots();
      renderStage();
    }

    function say(text, lang = 'en-US') {
      if (!('speechSynthesis' in window)) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      speechSynthesis.speak(u);
    }

    function listenThenCelebrate(onDone) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { onDone(true); return; } // مفيش دعم؟ اعتبرها نجحت (تسامح)
      const rec = new SR();
      rec.lang = 'ar-EG';
      rec.onresult = () => onDone(true);
      rec.onerror = () => onDone(true); // حتى لو ما اتسمعش كويس، تشجيع دايمًا
      rec.onend = () => {};
      try { rec.start(); } catch (e) { onDone(true); }
    }

    function renderStage() {
      const box = document.getElementById('stageBox');

      if (current >= STAGES.length) { renderRecommendation(); return; }
      const stage = STAGES[current];

      if (stage === 'learning_goal') {
        box.innerHTML = `
          <img src="assets/joe-wave.png" class="char-img" onerror="this.src='joe-wave.png'">
          <h2>مرحبًا يا ${studentName}!</h2>
          <p>النهاردة هنقول "صباح الخير"، نتعرف على بعض، ونسمع صوت حرفين جداد ✨</p>
          <button class="btn-big" id="nextBtn">يلا نبدأ 🚪</button>
        `;
        document.getElementById('nextBtn').onclick = () => completeStage('learning_goal');
      }

      else if (stage === 'story') {
        box.innerHTML = `
          <img src="assets/adam.jpg" class="char-img" style="border-radius:20px;" onerror="this.src='adam.jpg'">
          <p>قرّب آدم من بوابة إل الكبيرة... البوابة كانت نايمة من زمان 😴</p>
          <p>قال آدم: <b>"صباح الخير يا بوابة!"</b> 🌞</p>
          <p>البوابة فتحت عينيها وابتسمت... يلا بينا ندخل! 🎉</p>
          <button class="btn-big coral" id="nextBtn">كمل المغامرة</button>
        `;
        document.getElementById('nextBtn').onclick = () => completeStage('story');
      }

      else if (stage === 'adventure') {
        box.innerHTML = `
          <p>دوس على كل حاجة في البوابة عشان تعرف اسمها 👇</p>
          <div class="objects-row" id="objRow">
            <span data-name="جرس 🔔">🔔</span>
            <span data-name="باب 🚪">🚪</span>
            <span data-name="شنطة 🎒">🎒</span>
          </div>
          <p id="objLabel">&nbsp;</p>
          <button class="btn-big" id="nextBtn" disabled style="opacity:0.4;">كمل المغامرة</button>
        `;
        let revealedCount = 0;
        document.querySelectorAll('#objRow span').forEach(el => {
          el.onclick = () => {
            if (!el.classList.contains('revealed')) {
              el.classList.add('revealed');
              revealedCount++;
              document.getElementById('objLabel').textContent = el.dataset.name;
              say(el.dataset.name.split(' ')[0]);
              if (revealedCount === 3) {
                const btn = document.getElementById('nextBtn');
                btn.disabled = false;
                btn.style.opacity = 1;
              }
            }
          };
        });
        document.getElementById('nextBtn').onclick = () => completeStage('adventure');
      }

      else if (stage === 'game') {
        box.innerHTML = `
          <img src="assets/pinky.png" class="char-img" onerror="this.src='pinky.png'">
          <p><b>لو حد قالك "صباح الخير"، ترد عليه إزاي؟</b></p>
          <button class="mc-btn" data-correct="true">صباح النور 🌞</button>
          <button class="mc-btn">باي باي 👋</button>
          <button class="mc-btn">شكرًا 🙏</button>
          <p id="gameMsg" style="min-height:24px; font-weight:700; color:var(--color-brand-teal);"></p>
        `;
        document.querySelectorAll('.mc-btn').forEach(btn => {
          btn.onclick = () => {
            if (btn.dataset.correct) {
              document.getElementById('gameMsg').textContent = 'برافو عليك! 🌟';
              setTimeout(() => completeStage('game'), 900);
            } else {
              document.getElementById('gameMsg').textContent = 'قريب! جرب تاني 😊';
            }
          };
        });
      }

      else if (stage === 'practice') {
        box.innerHTML = `
          <img src="assets/joe-wave.png" class="char-img" onerror="this.src='joe-wave.png'">
          <p>قول مع آدم:</p>
          <h2>"Good morning!"</h2>
          <button class="mic-btn" id="micBtn">🎤</button>
          <p id="practiceMsg" style="min-height:24px; margin-top:10px;"></p>
        `;
        document.getElementById('micBtn').onclick = () => {
          say('Good morning', 'en-US');
          document.getElementById('practiceMsg').textContent = 'جاري الاستماع...';
          listenThenCelebrate(() => {
            document.getElementById('practiceMsg').textContent = 'جميل جدًا! 🌟';
            setTimeout(() => completeStage('practice'), 900);
          });
        };
      }

      else if (stage === 'song') {
        box.innerHTML = `
          <img src="assets/bella.png" class="char-img" onerror="this.src='bella.png'">
          <p style="font-size:19px; line-height:1.8;">
            🎵 صباح الخير يا صحابي<br>
            يلا بينا يا أحبابي 🎵
          </p>
          <button class="btn-big gold" id="nextBtn">غنيت! 🎶</button>
        `;
        document.getElementById('nextBtn').onclick = () => completeStage('song');
      }

      else if (stage === 'phonics') {
        const letter = letters[phonicsIndex];
        box.innerHTML = `
          <p>الحرف الكبير:</p>
          <h1 style="font-size:64px; color:var(--color-brand-teal); margin:8px 0;">${letter}${letter.toLowerCase()}</h1>
          <button class="btn-big" id="listenBtn" style="margin-bottom:14px;">🔊 اسمع النطق</button><br>
          <button class="mic-btn" id="micBtn">🎤</button>
          <p id="phonicsMsg" style="min-height:24px; margin-top:10px;"></p>
        `;
        document.getElementById('listenBtn').onclick = () => say(letter, 'en-US');
        document.getElementById('micBtn').onclick = async () => {
          document.getElementById('phonicsMsg').textContent = 'جاري الاستماع...';
          listenThenCelebrate(async () => {
            document.getElementById('phonicsMsg').textContent = '🌟🌟🌟 برافو!';
            await supabase.from('phonics_attempts').insert({
              student_id: studentId,
              unit_id: unitId,
              letter: letter,
              accuracy_score: 1,
              attempt_number: 1
            });
            phonicsIndex++;
            if (phonicsIndex < letters.length) {
              setTimeout(renderStage, 900);
            } else {
              setTimeout(() => completeStage('phonics'), 900);
            }
          });
        };
      }

      else if (stage === 'challenge') {
        box.innerHTML = `
          <img src="assets/pinky.png" class="char-img" onerror="this.src='pinky.png'">
          <p><b>تحدي أخير! إيه الحرف اللي اتعلمناه النهاردة؟</b></p>
          <button class="mc-btn" data-correct="true">T</button>
          <button class="mc-btn">M</button>
          <button class="mc-btn">G</button>
          <p id="chMsg" style="min-height:24px; font-weight:700; color:var(--color-brand-teal);"></p>
        `;
        document.querySelectorAll('.mc-btn').forEach(btn => {
          btn.onclick = () => {
            if (btn.dataset.correct) {
              document.getElementById('chMsg').textContent = '🎉🎊 تمام كده!';
              setTimeout(() => completeStage('challenge'), 900);
            } else {
              document.getElementById('chMsg').textContent = 'قريب أوي! جرب تاني 😊';
            }
          };
        });
      }

      else if (stage === 'assessment') {
        // مرحلة داخلية غير ظاهرة كاختبار للطفل — فقط شاشة انتقالية قصيرة
        box.innerHTML = `
          <img src="assets/joe-think.png" class="char-img" onerror="this.src='joe-think.png'">
          <p>Joe بيفكر شوية عشان يجهزلك مفاجأة... 🤔</p>
        `;
        setTimeout(() => completeStage('assessment', { stars: starsThisSession }), 1600);
      }
    }

    async function renderRecommendation() {
      const box = document.getElementById('stageBox');
      box.innerHTML = `
        <img src="assets/roro.png" class="char-img" onerror="this.src='roro.png'">
        <h2>🎉 خلصت أول محطة!</h2>
        <p class="stars-earned">⭐ ${starsThisSession}</p>
        <p>برافو عليك يا ${studentName}! لسه في ست محطات جميلة قدامك في عالم إل 🌍</p>
        <button class="btn-big" id="mapBtn">ارجع للخريطة</button>
      `;
      document.getElementById('mapBtn').onclick = () => location.href = 'world-map.html';
    }

    async function init() {
      const { data: unit } = await supabase
        .from('units').select('id').eq('order_index', 1).single();
      unitId = unit.id;

      // استكمال من حيث وصل الطالب (لو دخل تاني)
      const { data: progress } = await supabase
        .from('unit_progress')
        .select('stage')
        .eq('student_id', studentId)
        .eq('unit_id', unitId)
        .eq('status', 'completed');

      if (progress && progress.length) {
        const completedSet = new Set(progress.map(p => p.stage));
        while (current < STAGES.length && completedSet.has(STAGES[current])) current++;
      }

      renderDots();
      renderStage();
    }

    init();
  </script>
</body>
</html>
